# Variant I: Gated spherical nGPT-JEPA with a selective-SSM transition.
#   keep = sigmoid(K(h_t, a_t)); write = sigmoid(W(h_t, a_t))
#   candidate = normalize(UpdateNet(h_t, a_t))
#   h_pred = normalize(keep * h_t + write * candidate)
# SSM-style gating is used ONLY for the action-conditioned transition (not as a
# global image aggregator). Pair with loss.pred.type=cosine.
_target_: jepa.JEPA

normalize_emb: true
normalize_pred: true

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: variants.SphericalARPredictor
  mode: ssm
  gate_dim: channel
  update_mlp: true
  update_mlp_hidden: 2048
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
  act_dim: ${embed_dim}

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj: null
