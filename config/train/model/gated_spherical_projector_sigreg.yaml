# Variant G: Gated spherical nGPT-JEPA + projector SIGReg.
# Keeps h as the unit-sphere world state and adds z = Projector(h); SIGReg is
# applied to z (Gaussian) instead of directly to h (sphere). Pair with
# loss.pred.type=cosine AND loss.sigreg.target=projector_z (see experiment cfg).
_target_: jepa.JEPA

normalize_emb: true
normalize_pred: true

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: variants.SphericalARPredictor
  mode: gated
  alpha: 1.0
  gate_dim: channel
  gate_bias_init: 0.0
  update_mlp: true
  update_mlp_hidden: 2048
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
  act_dim: ${embed_dim}

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj: null

# h -> z Gaussian projector for SIGReg-on-z (train-time only)
sigreg_projector:
  _target_: variants.SIGRegProjector
  input_dim: ${embed_dim}
  hidden_dim: 2048
  output_dim: ${embed_dim}
